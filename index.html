  a { color: oklch(0.2 0.008 260); text-decoration: none; }
  a:hover { color: oklch(1 0 0); }

  @keyframes driftUp { from { transform: translateY(0%); } to { transform: translateY(-50%); } }
  @keyframes nameIn { from { opacity: 0; transform: translateY(46vh); } to { opacity: 1; transform: translateY(0); } }

class Component extends DCLogic {
  state = { active: null, zoom: null, about: false, k1: 1, k2: 1, narrow: typeof window !== "undefined" && window.innerWidth < 640 };

  componentDidMount() {
    this._key = (e) => { if (e.key === "Escape") this.setState(s => s.about ? { about: false } : (s.zoom !== null ? { zoom: null } : { active: null })); };
    this._resize = () => {
      const n = window.innerWidth < 640;
      if (n !== this.state.narrow) this.setState({ narrow: n });
      this._measure();
      this._measureStreams();
    };
    this._wheel = (e) => { this._push(-e.deltaY * 5, false); };
    this._tstart = (e) => { this._ty = e.touches[0].clientY; this._tt = performance.now(); this._moved = 0; };
    this._tmove = (e) => {
      const y = e.touches[0].clientY, now = performance.now();
      const dy = y - this._ty, dt = Math.max(8, now - this._tt);
      this._ty = y; this._tt = now; this._moved += Math.abs(dy);
      this._push(-dy * 1.6, true);
      this._lastV = (-dy / dt) * 1000 * 1.6;
    };
    this._tend = () => { if (this._moved > 10 && this._lastV) this._push(this._lastV * 0.6, false); this._lastV = 0; };
    window.addEventListener("keydown", this._key);
    window.addEventListener("resize", this._resize);
    window.addEventListener("wheel", this._wheel, { passive: true });
    window.addEventListener("touchstart", this._tstart, { passive: true });
    window.addEventListener("touchmove", this._tmove, { passive: true });
    window.addEventListener("touchend", this._tend, { passive: true });
    this._measureStreams();
    this._startDrift();
    this._measure();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(this._measure);
    setTimeout(this._measure, 400);
  }
  componentDidUpdate() { this._measure(); this._measureStreams(); }

  componentWillUnmount() {
    window.removeEventListener("keydown", this._key);
    window.removeEventListener("resize", this._resize);
    window.removeEventListener("wheel", this._wheel);
    window.removeEventListener("touchstart", this._tstart);
    window.removeEventListener("touchmove", this._tmove);
    window.removeEventListener("touchend", this._tend);
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  _st = { idx: { el: null, off: 0, v: 0, copy: 0, dur: 34 }, proj: { el: null, off: 0, v: 0, copy: 0, dur: 24 } };

  refIdx = (el) => { this._st.idx.el = el; };
  refProj = (el) => { this._st.proj.el = el; };

  _sign = (k) => (k === "idx" ? -1 : 1);

  _measureStreams = () => {
    for (const k of ["idx", "proj"]) {
      const s = this._st[k], el = s.el;
      if (!el) continue;
      const kids = el.children;
      const n = Math.floor(kids.length / 2);
      s.copy = n > 0 && kids[n] ? kids[n].offsetTop - kids[0].offsetTop : 0;
      s.dur = this.state.narrow ? (k === "idx" ? 60 : 40) : (k === "idx" ? 34 : 24);
    }
  };

  _startDrift = () => {
    const tick = (t) => {
      const dt = Math.min(0.06, (t - (this._last || t)) / 1000);
      this._last = t;
      for (const k of ["idx", "proj"]) {
        const s = this._st[k];
        if (!s.el || !s.copy) continue;
        const base = this._sign(k) * (s.copy / s.dur);
        s.off += (base + s.v) * dt;
        s.v *= Math.pow(0.9, dt * 60);
        if (Math.abs(s.v) < 0.5) s.v = 0;
        s.off = ((s.off % s.copy) + s.copy) % s.copy;
        s.el.style.transform = "translateY(" + (-s.off) + "px)";
      }
      this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
  };

  _push = (amount, drag, useSign) => {
    for (const k of ["idx", "proj"]) {
      const s = this._st[k];
      if (!s.copy) continue;
      const dir = useSign ? this._sign(k) : 1;
      if (drag) s.off += amount * dir;
      else s.v += amount * dir;
    }
  };

  refWrap = (el) => { this._wrap = el; };
  refLine1 = (el) => { this._l1 = el; };
  refLine2 = (el) => { this._l2 = el; };

  _measure = () => {
    const c = this._wrap, a = this._l1, b = this._l2;
    if (!c || !a || !b) return;
    const W = c.offsetWidth;
    const k1 = a.offsetWidth ? W / a.offsetWidth : 1;
    const k2 = b.offsetWidth ? W / b.offsetWidth : 1;
    if (Math.abs(k1 - this.state.k1) > 0.004 || Math.abs(k2 - this.state.k2) > 0.004) this.setState({ k1: k1, k2: k2 });
  };

  closeCase = () => this.setState({ active: null, zoom: null, about: false });
  goHome = () => this.setState({ active: null, zoom: null, about: false });
  stop = (e) => { e.stopPropagation(); };
  closeZoom = () => this.setState({ zoom: null });
  toggleAbout = (e) => { if (e) e.stopPropagation(); this.setState(s => ({ about: !s.about, zoom: null })); };
  closeAbout = (e) => { if (e) e.stopPropagation(); this.setState({ about: false }); };

  renderVals() {
    const list = this.cases();
    const a = this.state.active;
    const open = a !== null;
    const z = this.state.zoom;
    const narrow = this.state.narrow;
    const small = open || this.state.about;
    const words = String(this.props.ownerName ?? "Johann Schmitz").trim().split(/\s+/);
    const nameParts = [words[0] || "", words.slice(1).join(" ")];
    const pad = (i) => String(i + 1).padStart(2, "0");
    // fit the longest word without ever hyphenating
    const W = typeof window !== "undefined" ? window.innerWidth : 1440;
    const avail = narrow ? (0.44 * W - 30) : Math.min(Math.max(220, 0.21 * W), 300) - 46;
    const headline = this.state.about ? String(this.props.ownerName ?? "Johann Schmitz") : (open ? String(list[a].title) : "");
    const longest = headline ? headline.split(/\s+/).reduce((m, w2) => Math.max(m, w2.length), 1) : 1;
    const titleSize = Math.max(11, Math.min(narrow ? 21 : 30, Math.floor(avail / (0.84 * longest)))) + "px";
    const H = [narrow ? "46vh" : "38vw"];
    const S = ["-6vw", "4vw", "-12vw", "8vw", "-4vw", "2vw", "10vw", "-8vw"];

    const idx = list.map((c, i) => ({
      title: c.title, num: pad(i), h: H[i % H.length], shift: S[i % S.length],
      bg: this._bg(c.cover, "oklch(0.88 0.004 260)"),
      open: (e) => { e.stopPropagation(); if (this._moved > 10) return; this.setState({ active: i, zoom: null, about: false }); }
    }));

    const shots = open ? list[a].shots : list[0].shots;
    const proj = shots.map((s, i) => ({
      caption: s.caption,
      h: H[(i + 2) % H.length], shift: S[(i + 3) % S.length],
      bg: this._bg(s.src, "oklch(0.9 0.004 260)"),
      open: (e) => { e.stopPropagation(); if (this._moved > 10) return; this.setState({ zoom: i, about: false }); }
    }));
    const zs = z !== null && open ? shots[z] : null;

    return {
      closeCase: this.closeCase,
      goHome: this.goHome,
      stop: this.stop,
      toggleAbout: this.toggleAbout,
      closeAbout: this.closeAbout,
      aboutOpacity: this.state.about ? 1 : 0,
      aboutPointer: this.state.about ? "auto" : "none",
      aboutScale: this.state.about ? 1 : 0.84,
      aboutCopyX: this.state.about ? "0vw" : (narrow ? "18vw" : "-14vw"),
      aboutImgLeft: narrow ? "50%" : (open ? "calc(95vw - min(40vw, 62vh, 640px))" : "5vw"),
      aboutImgWidth: narrow ? "min(94vw, 44vh)" : "min(40vw, 62vh, 640px)",
      aboutCopyMaxWidth: narrow ? "42vw" : "clamp(220px, 21vw, 300px)",
      aboutCopyTop: narrow ? "auto" : "calc(50vh - min(20vw, 31vh, 320px) - 20px)",
      aboutCopyBottom: narrow ? "calc(9vh + min(94vw, 44vh) + 16px)" : "auto",
      aboutCopyLeft: narrow ? (open ? "auto" : "3vw") : (open ? "auto" : "calc(5vw + min(40vw, 62vh, 640px) + 40px)"),
      aboutCopyRight: narrow ? (open ? "3vw" : "auto") : (open ? "calc(5vw + min(40vw, 62vh, 640px) + 40px)" : "auto"),
      aboutBg: this._bg(this.props.portrait ?? "img/002-2.jpg", "oklch(0.87 0.004 260)"),
      aboutText: this.props.aboutText ?? "Product designer working across interfaces, systems, and the details in between. Currently open to new work.",
      closeZoom: this.closeZoom,
      zoomCaption: zs ? zs.caption : "",
      zoomBg: this._bg(zs ? zs.src : "", "oklch(0.84 0.004 260)"),
      zoomOpacity: zs && !this.state.about ? 1 : 0,
      zoomPointer: zs && !this.state.about ? "auto" : "none",
      zoomScale: zs ? 1 : 0.84,
      zoomWidth: narrow ? "min(94vw, 44vh)" : "min(40vw, 62vh, 640px)",
      zoomLeft: narrow ? "50%" : "calc(95vw - min(40vw, 62vh, 640px))",
      zoomHeight: narrow ? "min(94vw, 44vh)" : "min(40vw, 62vh, 640px)",
      zoomTop: narrow ? "auto" : "50%",
      zoomBottom: narrow ? "9vh" : "auto",
      zoomTX: narrow ? "-50%" : "0%",
      zoomTY: narrow ? "0%" : "-50%",
      streamOverhang: "-8vw",
      streamWidth: narrow ? "61vw" : "38vw",
      captionSize: narrow ? "8px" : "10px",
      titleSize: titleSize,
      bodySize: narrow ? "12px" : "clamp(14px, 1.1vw, 16px)",
      driftIndexDur: narrow ? "60s" : "34s",
      driftProjDur: narrow ? "40s" : "24s",
      nameX: !narrow && open ? "calc(91vw - 225px)" : (!narrow && this.state.about ? "1vw" : "0px"),
      nameLeft: narrow ? "6vw" : "4vw",
      nameRight: narrow ? "6vw" : "auto",
      nameAlign: narrow ? "center" : "left",
      nameOrigin: narrow ? "center bottom" : "left bottom",
      lineOrigin: narrow ? "center center" : "left center",
      nameBlockOffset: narrow ? "auto" : "0px",
      nameBlockWidth: narrow ? "88vw" : "535px",
      nameBottom: narrow && small ? "3.5vh" : "5vh",
      nameLine1: nameParts[0],
      nameLine2: nameParts[1],
      k1: this.state.k1,
      k2: this.state.k2,
      refWrap: this.refWrap,
      refIdx: this.refIdx,
      refProj: this.refProj,
      refLine1: this.refLine1,
      refLine2: this.refLine2,
      ownerName: this.props.ownerName ?? "Johann Schmitz",
      indexStream: idx.concat(idx),
      projectStream: proj.concat(proj),
      indexStreamX: open ? "72vw" : "0vw",
      indexStreamOpacity: open ? 0 : 1,
      indexPointer: open ? "none" : "auto",
      projectStreamX: open ? "0vw" : "-60vw",
      projectStreamOpacity: open ? 1 : 0,
      heroSlideX: open ? "0px" : "78vw",
      heroScale: open ? 1 : 0.86,
      heroOpacity: open && !zs && !this.state.about ? 1 : 0,
      heroVisibility: open && !zs && !this.state.about ? "visible" : "hidden",
      heroBg: this._bg(open ? list[a].cover : "", "oklch(0.86 0.004 260)"),
      heroCaption: open ? pad(a) + " — " + list[a].title : "",
      activeTitle: open ? list[a].title : "",
      activeBody: open ? list[a].body : "",
      activeMeta: open ? pad(a) + " / " + pad(list.length - 1) : "",
      copyTop: narrow ? "7vh" : "calc(50vh - min(20vw, 31vh, 320px) - 20px)",
      copyBottom: "auto",
      copyLeft: narrow ? "auto" : "auto",
      copyRight: narrow ? "3vw" : "calc(5vw + min(40vw, 62vh, 640px) + 40px)",
      copyMaxWidth: narrow ? "44vw" : "clamp(220px, 21vw, 300px)",
      copyPad: narrow ? "14px 14px 16px" : "20px 22px 22px",
      copyBg: "oklch(1 0 0)",
      copyX: open ? "0vw" : (narrow ? "18vw" : "-14vw"),
      nameOpacity: 1,
      nameVisibility: "visible",
      copyOpacity: open && !this.state.about ? 1 : 0,
      copyPointer: open && !this.state.about ? "auto" : "none",
      nameScale: narrow ? (small ? 0.42 : 1) : (small ? 0.42 : 0.64),
      taglineOpacity: narrow ? 1 : (open ? 0 : 1),
      hintOpacity: open ? 0 : 1
    };
  }
}

</script>
</body>
</html>
